<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Claw Machine Demo</title>
<style>
  :root{--ink:#1b1b1d;--paper:#fafcff;--blush:#f4a6b8;--brown:#a67c52;--butter:#fff0c4;--sky:#cfe6f5}
  html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);
    font-family:ui-rounded,"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Varela Round",system-ui,sans-serif}
  #wrap{max-width:min(560px,calc((100vh - 110px)*6/7));margin:0 auto;padding:10px}
  canvas{display:block;width:100%;aspect-ratio:6/7;touch-action:none;cursor:pointer}
  #bar{display:flex;gap:10px;margin-top:10px}
  button{border:4px solid var(--ink);border-radius:16px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);
    padding:10px 0;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:none;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .06s,box-shadow .06s}
  button:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
  button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
  #l,#r{background:var(--paper);flex:0 0 20%}
  #d{background:var(--blush);flex:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Claw machine"></canvas>
  <div id="bar">
    <button id="l" aria-label="Move left">&#9664;</button>
    <button id="d">Drop</button>
    <button id="r" aria-label="Move right">&#9654;</button>
  </div>
</div>

var toys=[],confetti=[],keys={l:false,r:false},claw,state='idle',target=null,held=null;
var t=0,winT=0,waitT=0,lastTime=0,prevVx=0;

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function approach(v,to,step){return v<to?Math.min(to,v+step):Math.max(to,v-step)}
function armA(o){return .35+.55*o}
function tipDy(o){return 45*Math.cos(armA(o))+45*Math.cos(.35)}

function fit(){
  var dpr=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||600;
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*H/W);
  ctx.setTransform(cv.width/W,0,0,cv.width/W,0,0);
}
window.addEventListener('resize',fit);

/* ---------- toys ---------- */
function newToy(x,y){
  return {x:x,y:y,vy:0,rot:rnd(-.25,.25),flip:Math.random()<.5?-1:1,size:rnd(.96,1.04),sx:1,sy:1};
}
function fillMachine(){
  var i,n=0;
  for(i=0;i<5;i++)toys.push(newToy(218+i*78+rnd(-4,4),-60-(n++)*55));
  for(i=0;i<4;i++)toys.push(newToy(257+i*78+rnd(-4,4),-60-(n++)*55));
}
function restY(k){
  var y=FLOOR-R,i,j;
  if(k.prize)return y;
  for(i=0;i<toys.length;i++){
    j=toys[i];
    if(j!==k&&!j.held&&!j.prize&&j.y>k.y&&Math.abs(j.x-k.x)<60)y=Math.min(y,j.y-STACK);
  }
  return y;
}

/* ---------- setup ---------- */
function start(){
  fit();fillMachine();
  claw={x:330,tx:330,y:HOME,vy:0,vx:0,open:1,sw:0,swV:0};
  lastTime=performance.now();requestAnimationFrame(loop);
}

/* ---------- input ---------- */
function hold(id,k){
  var b=document.getElementById(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[k]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){keys[k]=false})});
}
hold('l','l');hold('r','r');
document.getElementById('d').addEventListener('pointerdown',function(e){e.preventDefault();drop()});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){keys.l=true;e.preventDefault()}
  else if(e.key==='ArrowRight'){keys.r=true;e.preventDefault()}
  else if(e.key==='ArrowDown'||e.key===' '||e.key==='Enter'){if(e.target.tagName!=='BUTTON'||e.target.id==='d')drop();e.preventDefault()}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.l=false;
  if(e.key==='ArrowRight')keys.r=false;
});
window.addEventListener('blur',function(){keys.l=keys.r=false});
var dragging=false;
function aimTo(e){
  if(state!=='idle')return;
  var rc=cv.getBoundingClientRect();
  claw.tx=clamp((e.clientX-rc.left)/rc.width*W,XMIN,XMAX);
}
cv.addEventListener('pointerdown',function(e){dragging=true;aimTo(e)});
cv.addEventListener('pointermove',function(e){if(dragging)aimTo(e)});
window.addEventListener('pointerup',function(){dragging=false});

function drop(){
  if(state!=='idle')return;
  state='drop';target=null;held=null;claw.vy=80;claw.tx=claw.x;
  
}

/* ---------- update ---------- */
function update(dt){
  var i,k,oldX=claw.x;
  t+=dt;

  if(state==='idle'){
    if(keys.l)claw.tx=clamp(claw.tx-320*dt,XMIN,XMAX);
    if(keys.r)claw.tx=clamp(claw.tx+320*dt,XMIN,XMAX);
    claw.x+=(claw.tx-claw.x)*Math.min(1,dt*9);
  }else if(state==='drop'){
    claw.vy=Math.min(claw.vy+700*dt,360);claw.y+=claw.vy*dt;
    var tip=claw.y+tipDy(claw.open);
    for(i=0;i<toys.length;i++){
      k=toys[i];
      if(!k.held&&!k.prize&&Math.abs(k.x-claw.x)<40&&tip>=k.y-R*.45&&(!target||k.y<target.y))target=k;
    }
    if(target||tip>=FLOOR-6){state='close'}
  }else if(state==='close'){
    claw.open=approach(claw.open,0,dt*2.2);
    if(target&&!held&&claw.open<.6){
      held=target;held.held=true;held.sx=1.14;held.sy=.86;
          }
    if(claw.open<=0)state='lift';
  }else if(state==='lift'){
    claw.y=approach(claw.y,HOME,clamp((claw.y-HOME)*4+70,70,280)*dt);
    if(claw.y<=HOME){
      if(held){state='carry';}
      else{state='reopen';}
    }
  }else if(state==='carry'){
    claw.x=approach(claw.x,CHUTE_X,230*dt);claw.tx=claw.x;
    if(claw.x===CHUTE_X){state='release';waitT=0}
  }else if(state==='release'){
    waitT+=dt;claw.open=approach(claw.open,1,dt*3);
    if(held&&claw.open>.5){
      held.held=false;held.prize=true;held.rot=0;held.vy=0;held=null;
    }
    if(!held&&claw.open>=1&&waitT>.4){state='idle';claw.tx=330}
  }else if(state==='reopen'){
    claw.open=approach(claw.open,1,dt*3);
    if(claw.open>=1)state='idle';
  }

  /* rope sway: the claw hangs like a pendulum and lags behind its own movement */
  claw.vx=(claw.x-oldX)/dt;
  claw.swV-=(claw.vx-prevVx)*.004;prevVx=claw.vx;
  claw.swV+=(-45*claw.sw-4*claw.swV)*dt;
  claw.sw=clamp(claw.sw+claw.swV*dt,-.35,.35);

  /* toys */
  for(i=0;i<toys.length;i++){
    k=toys[i];
    k.sx+=(1-k.sx)*Math.min(1,dt*10);k.sy+=(1-k.sy)*Math.min(1,dt*10);
    if(k.held){
      var d=claw.y-RAIL+tipDy(claw.open)-14;
      k.x+=(claw.x-d*Math.sin(claw.sw)-k.x)*Math.min(1,dt*14);
      k.y+=(RAIL+d*Math.cos(claw.sw)-k.y)*Math.min(1,dt*14);
      k.rot=-claw.sw*.8+Math.sin(t*7)*.04;
    }else{
      var ry=restY(k);
      if(k.y>ry)k.y=ry;
      if(k.y<ry||k.vy<0){
        k.vy+=1900*dt;k.y+=k.vy*dt;
        if(k.y>=ry){
          k.y=ry;
          if(k.vy>260){k.sx=1.12;k.sy=.88}
          if(k.prize&&k.vy>260){k.vy=-k.vy*.3}
          else{
            if(k.prize&&!k.won){k.won=true;winT=2.2;burst(k.x,k.y);}
            k.vy=0;
          }
        }
      }
    }
  }
  if(winT>0){
    winT-=dt;
    if(winT<=0){
      winT=0;
      toys=toys.filter(function(k){return !k.prize});
      if(toys.length<5)fillMachine();
    }
  }
  for(i=confetti.length-1;i>=0;i--){
    var p=confetti[i];p.vy+=800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;p.life-=dt;
    if(p.life<=0)confetti.splice(i,1);
  }
}
function burst(x,y){
  var cols=[BLUSH,BROWN,PAPER,GOLD,CHAR];
  for(var i=0;i<42;i++)confetti.push({x:x,y:y-30,vx:rnd(-280,280),vy:rnd(-640,-220),
    a:rnd(0,6),va:rnd(-9,9),life:rnd(1,1.7),c:cols[i%cols.length],sq:i%2===0});
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function box(x,y,w,h,r,fill,lw){
  rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw||5;ctx.strokeStyle=INK;ctx.stroke();
}
function dot(x,y,r,fill,lw){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw||4;ctx.strokeStyle=INK;ctx.stroke();
}
function drawToy(k){
  var s=80*k.size,h=s*img.height/img.width;
  ctx.save();ctx.translate(k.x,k.y+R);ctx.rotate(k.rot);ctx.scale(k.flip*k.sx,k.sy);
  ctx.drawImage(img,-s/2,-h+2,s,h);ctx.restore();
}
function drawClaw(){
  var L=claw.y-RAIL,a=armA(claw.open),b=.35,side,pass,pts=[];
  box(claw.x-28,RAIL-15,56,30,11,CHAR,5);dot(claw.x,RAIL,5,BUTTER,3);
  ctx.save();ctx.translate(claw.x,RAIL);ctx.rotate(claw.sw);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=INK;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,L);ctx.stroke();
  ctx.strokeStyle=PAPER;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,L);ctx.stroke();
  for(side=-1;side<=1;side+=2){
    var sx=side*10,ex=sx+side*Math.sin(a)*45,ey=L+Math.cos(a)*45;
    pts.push([sx,ex,ey,ex-side*Math.sin(b)*45,ey+Math.cos(b)*45]);
  }
  for(pass=0;pass<2;pass++){
    ctx.strokeStyle=pass?PAPER:INK;ctx.lineWidth=pass?7:16;
    pts.forEach(function(p){ctx.beginPath();ctx.moveTo(p[0],L);ctx.lineTo(p[1],p[2]);ctx.lineTo(p[3],p[4]);ctx.stroke()});
  }
  pts.forEach(function(p){dot(p[3],p[4],7,BLUSH,3)});
  dot(0,L,17,BUTTER,5);
  ctx.restore();
}
function drawControls(){
  var lean=state==='idle'?clamp((claw.tx-claw.x)/50,-1,1):0,jx=330,jy=648;
  ctx.lineCap='round';
  ctx.strokeStyle=INK;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(jx,jy);ctx.lineTo(jx+lean*17,jy-30);ctx.stroke();
  ctx.strokeStyle=PAPER;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(jx,jy);ctx.lineTo(jx+lean*17,jy-30);ctx.stroke();
  dot(jx+lean*17,jy-34,13,BLUSH,4);
  box(jx-26,jy-4,52,22,9,CHAR,4);
  var press=state==='idle'?0:6;
  dot(450,646,30,CHAR,4);dot(450,638+press,23,BLUSH,4);
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  /* cabinet */
  box(6,6,588,688,38,BLUSH,8);
  ctx.fillStyle=INK;ctx.font='700 32px ui-rounded,"Arial Rounded MT Bold","Varela Round",system-ui,sans-serif';
  ctx.textAlign='center';ctx.fillText('Grab a prize!',W/2,52);
  /* window */
  box(26,72,548,490,14,BUTTER,6);
  ctx.save();rr(26,72,548,490,14);ctx.clip();
  box(146,420,16,150,3,BROWN,4);
  box(30,436,114,FLOOR-436+10,10,PAPER,4);
  ctx.fillStyle=INK;ctx.font='700 18px ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif';
  ctx.fillText('Prize chute',87,468);
  ctx.fillStyle=BROWN;ctx.fillRect(20,FLOOR,560,20);
  ctx.fillStyle=INK;ctx.fillRect(20,FLOOR,560,5);
  /* rail */
  box(20,RAIL-6,560,12,5,CHAR,4);
  /* aim shadow on the floor */
  ctx.fillStyle='rgba(27,27,29,.2)';
  ctx.beginPath();ctx.ellipse(claw.x,FLOOR-3,36,7,0,0,Math.PI*2);ctx.fill();
  for(i=0;i<toys.length;i++)if(!toys[i].held)drawToy(toys[i]);
  for(i=0;i<toys.length;i++)if(toys[i].held)drawToy(toys[i]);
  drawClaw();
  /* glass glare */
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.moveTo(44,76);ctx.lineTo(92,76);ctx.lineTo(48,FLOOR);ctx.lineTo(44,FLOOR);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(104,76);ctx.lineTo(120,76);ctx.lineTo(80,FLOOR);ctx.lineTo(66,FLOOR);ctx.closePath();ctx.fill();
  ctx.restore();
  rr(26,72,548,490,14);ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();
  /* control panel */
  box(26,582,548,92,18,CHAR,6);
  box(44,598,116,76,12,INK,4);
  drawControls();
  /* confetti */
  for(i=0;i<confetti.length;i++){
    var p=confetti[i];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle=p.c;ctx.lineWidth=2.5;ctx.strokeStyle=INK;
    if(p.sq){ctx.fillRect(-6,-4,12,8);ctx.strokeRect(-6,-4,12,8)}
    else{ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.stroke()}
    ctx.restore();
  }
  /* win sticker */
  if(winT>0){
    var sc=Math.min(1,(2.2-winT)*6);
    ctx.save();ctx.translate(W/2,290);ctx.rotate(-.06);ctx.scale(sc,sc);
    box(-170,-48,340,96,26,BLUSH,7);
    ctx.fillStyle=INK;ctx.font='700 50px ui-rounded,"Arial Rounded MT Bold","Varela Round",system-ui,sans-serif';
    ctx.textAlign='center';ctx.fillText('Nice grab!',0,17);
    ctx.restore();
  }
}
function loop(now){
  var dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;
  if(dt>0)update(dt);
  draw();requestAnimationFrame(loop);
}
})();
</script>
